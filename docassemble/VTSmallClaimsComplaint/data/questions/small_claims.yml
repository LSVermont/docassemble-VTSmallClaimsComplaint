############################### CASE INFO ###############################
---
id: choose a court county
question: |
  What county is your case in?
fields:
  - note: |
      Choose the county where you will file this form.

      You can choose the county where you live, or the county where the defendant is.

  - County: user_selected_county
    code: sorted(all_courts.unique_column_values('branch') - {"Environmental", "Judicial Bureau", "Criminal", "Family"} )
  
  - note: |
      ${ collapse_template(in_which_county) }
---
id: claim principal
question: |
  How much are you suing for?
subquestion: |
  The total amount of your "claim" in small claims courts cannot be more than $10,000. There are three things that make up your total:

  - The "principal" (your damages)
  - Any interest you want to claim on that amount (people often say $0)
  - Your court filing fee, if you want to get that amount back from the other party ($65 for claims of $1,000 or less / $90 for more than $1,000)

  **Let's start with your damages / the principal.**
  
  What are your "damages"? How much does the defendant owe you, or how much money did they cause you to lose?

  Special types of damages you should know about:

  - Are you suing a former landlord over a security deposit? You can ask for double the total amount of the deposit if your landlord kept the deposit without a written reason, or if they waited more than 14 days to get your deposit back to you. See the [Security Deposit Roadmap on VTLawHelp.org](https://vtlawhelp.org/roadmap/security-deposit/step-1) for more information.
  
  - Are you a customer suing a business over a product or service that they sold you? You may be entitled to triple the amount you spent on the product or service, if the business lied to you about the product or service.
fields:
  - "Damages / principal you want to claim": claim_principal
    datatype: currency
    min: 1
    max: 10000
---
code: |
  max_interest = 10000 - claim_principal
---
id: claim interest
question: |
  How much interest do you want to claim?
subquestion: |
  You can leave this blank or say $0.
  
  Usually, people do not add a separate interest amount on the small claims complaint form, unless a lawyer has told them to do so for some reason.
fields:
  - "Interest you want to claim": claim_interest
    datatype: currency
    max: ${ round(max_interest, 2) }
    validation messages:
      max: |
        The combined total of your claim and interest cannot exceed $10,000.00. Based on the amount of your claim, the maximum interest you can ask for is $${ round(max_interest, 2) }.
    required: False
---
id: claim court costs
question: |
  Court fee
subquestion: |
  Most people include the court filing fee in the amount they want to get from the defendant.
  
  In your case, your court filing fee is **${ currency(claim_court_fee)  }**.
fields:  
  - Do you want to add it to the amount you want to get from the defendant?: wants_to_claim_court_fee
    datatype: yesnoradio
  - note: |
      A reminder:
  
      * If your claim is $1,000 or less the fee will be $65.
      * If your claim is more than $1,000 the fee will be $90.

      When you give your small claims complaint to the court, you need to either pay the filing fee or hand in a fee waiver form. If you have a low income and want to apply for a fee waiver, we will point you to the VTCourtForms Fee Waiver tool when you are done here. 
  
continue button field: claim_court_costs
---
### Code to get court fee amount ####
code: |
  if claim_principal + claim_interest > 1000:
    claim_court_fee = 90
  else:
    claim_court_fee = 65
---
### Code to get total claim amount and set max amount to $10,000 ###
code: |
  claim_amount_total = 0
  claim_amount_total = claim_principal + claim_interest + claim_court_fee
  if claim_amount_total > 10000:
    amount_over_10k = claim_amount_total - 10000
---
id: recap total claim
question: |
  Your total claim
subquestion: |
  Let's review your total claim.
  
  - Principal/damages: ${ currency(claim_principal) }
  
  - Interest: ${ currency(claim_interest) }

  % if wants_to_claim_court_fee:
  - Court filing fee: ${ currency(claim_court_fee) }
  % else:
  - Court filing fee: $0
  % endif

  % if claim_amount_total > 10000:
    **You have gone over the $10,000 limit for small claims court by ${ currency(amount_over_10k) }**. If you want to use small claims court, go back and edit one of your amounts.
  % else:
  **TOTAL OF ${ currency(claim_amount_total) }**

  This is the amount you will ask the court for.

  Tap Next to continue. If you want to change these amounts, tap Undo to go back.
  % endif
continue button field: recap_total_claim
---
id: complaint description
question: |
  What happened?
fields:
  - "In your own words, describe why you are suing ${ other_parties }": complaint_description
    input type: area
---
id: documents attached to complaint
question: |
  Supporting documents
subquestion: |
  Supporting documents can include anything that supports your case.
  
  Examples include:
  
  - contracts
  - photos
  - emails or texts

  If you include copies of supporting documents with your small claims complaint, later you will need to send copies to the defendant, too.
  
fields:
  - "Are you including supporting documents in your small claims complaint?": documents_attached_to_complaint
    datatype: yesnoradio
