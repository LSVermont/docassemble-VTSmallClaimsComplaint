      % if defined("item.birthdate"):
      ${ item.birthdate }
      % else:
      Unknown
      % endif
      % endif
      
      Address:
      
      ${ item.address }

      % endfor
  - note: |
      ###Your claim  
  - Edit: 
      - claim_principal
      - recompute: 
          - claim_court_fee
    button: |
      **Damages / principal you want to claim**:
      ${ currency(claim_principal) }
  - Edit:
      - claim_interest
      - recompute: 
          - claim_court_fee
    button: |
      **Interest you want to claim**:
      ${ currency(claim_interest) }
  - Edit: wants_to_claim_court_fee
    button: |
      **Your court filing fee**:
      ${ currency(claim_court_fee) }

      **You want to add that court fee to your claim**:
      ${ word(yesno(wants_to_claim_court_fee)) }
  - note: |
      % if (claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0)) > 10000:
      <i class="fas fa-hand-paper fa-3x" aria-hidden="true"></i>  **STOP!**
  
      **You have gone over the $10,000 limit for small claims court by ${ currency(claim_principal + claim_interest + claim_court_fee - 10000) }**. 
  
      If you want to use small claims court, click **Edit** on the amounts.
      % else:
      **Your TOTAL claim**:
      ${ currency(claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0)) }
      % endif

      
  - Edit: complaint_description
    button: |
      **Why you are suing for ${ currency(claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0)) }. Be specific.**:
      ${ single_paragraph(complaint_description) }
  - Edit: user_selected_county
    button: |
      **Court where you will file this complaint**:
      Small claims court in ${ user_selected_county } County

  - Edit: documents_attached_to_complaint
    button: |
      **You are including supporting documents with your Small Claims Complaint now**: ${ word(yesno(documents_attached_to_complaint)) }

      (This question is for the Certificate of Service form that this tool produces.)
---
id: users.revisit
continue button field: users.revisit
question: |
  Edit info about you
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
id: users.table
table: users.table
rows: users
columns:
  - Name: |
      row_item.name.full() if defined("row_item.name.first") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
  - Address: |
      row_item.address.block() if defined("row_item.address.address") else ""
  - Mailing address: |
      row_item.mailing_address.block() if defined("row_item.mailing_address.address") else ""
  - Email: |
      row_item.email if defined("row_item.email") else ""
  - Home or cell phone: |
      row_item.phone_number if defined("row_item.phone_number") else ""
  - Work or other phone: |
      row_item.work_phone_number if defined("row_item.work_phone_number") else ""
  - Signature on form: |
      row_item.signature if defined("row_item.signature") else ""
edit:
  - name.first
  - birthdate
  - address.address
  - mailing_address.address
  - email
  - phone_number
  - work_phone_number
  - signature
confirm: True
---
id: attorneys.revisit
continue button field: attorneys.revisit
question: |
  Edit info about your lawyer
subquestion: |
  ${ attorneys.table }

  ${ attorneys.add_action() }
---
id: attorneys.table
table: attorneys.table
rows: attorneys
columns:
  - Name: |
      row_item.name.full() if defined("row_item.name.first") else ""
  - Address: |
      row_item.address.block() if defined("row_item.address.address") else ""
  - Phone: |
      row_item.phone_number if defined("row_item.phone_number") else ""
  - Email: |
      row_item.email if defined("row_item.email") else ""
edit:
  - name.first
  - address.address
  - phone.number
  - email
confirm: True
---
id: other_parties.revisit
continue button field: other_parties.revisit
question: |
  Edit info about the other party / defendant(s)
subquestion: |
  ${ other_parties.table }

  ${ other_parties.add_action() }
---
id: other_parties.table
table: other_parties.table
rows: other_parties
columns:
  - Name: |
      row_item.name.full() if defined("row_item.name.first") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
  - Address: |
      row_item.address.block() if defined("row_item.address.address") else ""
edit:
  - name.first
  - birthdate
  - address.address
confirm: True
---
code: |
  default_printed_signature = users[0].name
---
id: signing your forms
question: |
  Signature date
fields:
  - "This is how the name will appear under the signature.": printed_signature
    default: |
      ${ default_printed_signature }
    maxlength: 34
    required: False

  - note: |
      If you said you have a lawyer, and you want them to sign the form, you can edit the name above.
    show if: attorneys[0].name.first ! = ""
    
  - "Date of the signature for the Complaint form": signature_date
    datatype: date
    required: False
    default: |
      ${ today() }
  -  note: |
       You can change this date later if you want.
       
       **Tap Next to choose how to sign your documents.**
---
id: signature choice
decoration: file-signature
question: |
  Your documents are almost ready
subquestion: |
  How do you want to sign them?
fields: 
  - I will sign: signature_choice
    input type: radio
    choices:
      - On my computer or phone: this_device
    show if:
      code: |
        al_form_requires_digital_signature
  - I will sign: signature_choice
    input type: radio
    choices:
      - On my computer or phone: this_device
      - On the paper with a pen after I print the documents: sign_after_printing
    show if:
      code: |
        not al_form_requires_digital_signature
continue button field: saw_signature_choice    
---
id: persons signature
generic object: ALIndividual
question: |
  Please sign below
signature: x.signature
progress: 99
---
##################### PREVIEW SCREEN #######################
---
id: preview small claims complaint
question: |
  Preview your form before you sign it
subquestion: |
  
  Here is a preview of the form you will sign on the next screen. You will notice that the Judiciary includes two pages of instructions with the Small Claims Complaint form.
  
  ${ al_court_bundle.as_pdf(key='preview') }

  Click the image to view it in a new tab. **Remember to come back to this screen to edit the form and/or finish the form.**
  
  Click the "Edit your answers" button to make changes.

  ${ action_button_html(url_action('review_small_claims'), label='<i class="fa-solid fa-pencil"></i> Edit your answers', color='info') }

  **Tap Next to choose how to sign your form.**
  
continue button field: small_claims_complaint_preview_question    
---
##################### DOWNLOAD SCREEN #####################
---
id: download screen
event: VT_small_claims_complaint_download
question: |
  ${download_screen_instructions_headline}
subquestion: |
  ${ download_screen_instructions }

  ${ action_button_html(url_action('review_small_claims'), label='<i class="fa-solid fa-pencil"></i> Edit your answers', color='info') }

  <hr>
  
  <h4 style="margin-bottom: 18px;">Documents to download</h4>
  <i class="fa fa-exclamation-circle fa-2x"></i>   Download **all** of these documents.
  
  You will give your Complaint form to the court **now**. You will hold on to your Certificate of Service form and the "blank" forms to share with the defendant **later**. See the Next Steps document for details.
  
  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

  <hr>  
  
  ${ download_screen_bottom_instructions }
  
  ${ collapse_template(not_seeing_email) }
  ${ collapse_template(log_out_when_done) }

progress: 100
---
##################### ATTACHMENTS #####################
---
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[
      VT_small_claims_complaint_Post_interview_instructions,
      VT_small_claims_complaint_attachment,
      VT_small_claims_certificate_of_service_attachment, 
      VT_small_claims_information_and_instructions_for_defendant_attachment,
      VT_small_claims_answer_attachment,
      VT_small_claims_disclosure_of_exempt_income_attachment,
      VT_blank_small_claims_certificate_of_service_attachment], 
      filename="VT_small_claims", title="Download all forms", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[
      VT_small_claims_complaint_attachment], 
      filename="VT_small_claims", title="All forms to deliver to court", enabled=True)
---
objects:
  - VT_small_claims_complaint_attachment: ALDocument.using(title="Your Small Claims Complaint", filename="small_claims_complaint_with_info_100_00257.pdf", enabled=True, has_addendum=True, default_overflow_message="[See addendum]")
  - VT_small_claims_certificate_of_service_attachment: ALDocument.using(title="Your Certificate of Service", filename="small_claims_certificate_of_service_100_00260.pdf", enabled=True, has_addendum=False)
  - VT_small_claims_information_and_instructions_for_defendant_attachment: ALDocument.using(title="BLANK Small claims information and instructions form 100-00259 for defendant", filename="Small_Claims_Information_and_Instructions_for_Defendant_100_00259.pdf", enabled=True, has_addendum=False)
  - VT_small_claims_disclosure_of_exempt_income_attachment: ALDocument.using(title="BLANK Disclosure of exempt income form 100-00128 for defendant", filename="Disclosure_of_Exempt_Income_100_00128.pdf", enabled=True, has_addendum=False)
  - VT_small_claims_answer_attachment: ALDocument.using(title="BLANK Answer form 100-00126 for defendant", filename="100-00126_Small_Claims_Answer.pdf", enabled=True, has_addendum=False)
  - VT_blank_small_claims_certificate_of_service_attachment: ALDocument.using(title="BLANK Certificate of Service for defendant", filename="100-00260_Certificate_of_Service_-_Small_Claims_0.pdf", enabled=True, has_addendum=False)
  - VT_small_claims_complaint_Post_interview_instructions: ALDocument.using(title="NEXT STEPS - Instructions for filing your forms with the court", filename="small_claims_complaint_next_steps.docx", enabled=True, has_addendum=False)
---
attachment:
  variable name: VT_small_claims_complaint_attachment.addendum
  docx template file: VT_small_claims_complaint_addendum.docx
---
code: |
  VT_small_claims_complaint_attachment.overflow_fields['other_parties'].overflow_trigger = 1
  VT_small_claims_complaint_attachment.overflow_fields['other_parties'].label = "Additional defendants:"
  VT_small_claims_complaint_attachment.overflow_fields['other_parties'].headers = [
    {"name": "Name"},
    {"birthdate": "Birthdate"},
    {"address": "Address"},
  ]
  VT_small_claims_complaint_attachment.overflow_fields.gathered = True  
---
attachments:
  - name: Post-interview-Instructions
    filename: small_claims_complaint_next_steps
    docx template file: small_claims_complaint_next_steps.docx
    variable name: VT_small_claims_complaint_Post_interview_instructions[i]
    skip undefined: True
    tagged pdf: True
    fields:
      - "address_county": ${ trial_court.address.county }
      - "division": ${ trial_court.division }
      - "name": ${ trial_court }
      - "address_address": ${ trial_court.address.address }
      - "address_unit": ${ trial_court.address.unit }
      - "address_city": ${ trial_court.address.city }
      - "address_state": ${ trial_court.address.state }
      - "address_zip": ${ trial_court.address.zip }
      - "arbitrary_attribute": ${ trial_court.arbitrary_attribute }
      - "phone": ${ trial_court.phone }
      - "email": ${ trial_court.email }
  - name: VT small claims complaint attachment
    filename: small_claims_complaint_with_info_100_00257.pdf
    variable name: VT_small_claims_complaint_attachment[i]        
    skip undefined: True
    pdf template file: small_claims_complaint_with_info_100_00257.pdf
    fields:
      - "trial_court_county": ${ user_selected_county }
      - "users1_name": ${ users[0] }
      - "users1_name_full": ${ users[0] }
      - "users1_address_line_one": ${ users[0].address.line_one() }
      - "users1_address_line_two": ${ users[0].address.line_two() }
      - "users1_birthdate": ${ format_date(users[0].birthdate, format='M/d/yyyy') }
      - "users1_phone_number": ${ phone_number_formatted(users[0].phone_number) }
      - "users1_work_phone_number": ${ phone_number_formatted(users[0].work_phone_number) }
      - "users1_email": ${ users[0].email }
      - "users1_attorneys_name": ${ attorneys[0] }
      - "users1_attorneys_address_line_one": ${ attorneys[0].address.line_one() }
      - "users1_attorneys_address_line_two": ${ attorneys[0].address.line_two() }
      - "other_parties1_name": ${ other_parties.short_list(1) if other_parties.number_gathered() > 1 else other_parties[0]}
      - "other_parties1_name1": ${ other_parties[0] }
      - "other_parties1_address_line_one": ${ other_parties[0].address.line_one() }
      - "other_parties1_address_line_two": ${ other_parties[0].address.line_two() }
      - "other_parties1_birthdate": |
          % if other_parties[0].birthdate == null:
            ${ "" }
          % elif other_parties[0].person_type == "ALIndividual":
            ${ format_date(other_parties[0].birthdate, format='M/d/yyyy') }
          % else:
            ${ "" }
          % endif
      - "claim_amount_principal": ${ thousands(claim_principal,show_decimals=True) }
      - "claim_amount_interest": ${ thousands(claim_interest,show_decimals=True) }
      - "claim_amount_court_costs": ${ thousands(claim_court_fee if wants_to_claim_court_fee else 0,show_decimals=True) }
      - "claim_amount_total": ${ thousands((claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0)),show_decimals=True) }
      - "complaint_description": ${ complaint_description }
      - "signature_date": ${ signature_date }
      - "users1_name_1": ${ printed_signature }
      - "users1_signature": ${ users[0].signature }
        
  - name: VT small claims certificate of service attachment
    filename: small_claims_certificate_of_service_100_00260.pdf    
    variable name: VT_small_claims_certificate_of_service_attachment[i]        
    skip undefined: True
    pdf template file: small_claims_certificate_of_service_100_00260.pdf
    fields:
      - "COS_trial_court_county": ${ user_selected_county }
      - "COS_plaintiff": ${ users[0] }
      - "COS_defendant": ${ other_parties.short_list(2) }
      - "COS_name_full": ${ attorneys[0] if user_has_attorney else users[0] }
      - "mailed_summons": Yes
      - "mailed_complaint": Yes
      - "mailed_info_and_instructions_for_defendant": Yes
      - "mailed_blank_answer_form": Yes
      - "mailed_documents_attached_to_complaint": ${ documents_attached_to_complaint }
      - "COS_signer_name": ${ printed_signature }
      - "COS_mailing_address_line_one": |
          % if defined("users[0].mailing_address.address"):
          ${ attorneys[0].address.line_one() if user_has_attorney else users[0].mailing_address.line_one() }
          % else:
          ${ attorneys[0].address.line_one() if user_has_attorney else users[0].address.line_one() }
          % endif
      - "COS_mailing_address_line_two":  |
          % if defined("users[0].mailing_address.address"):
          ${ attorneys[0].address.line_two() if user_has_attorney else users[0].mailing_address.line_two() }
          % else:
          ${ attorneys[0].address.line_two() if user_has_attorney else users[0].address.line_two() }
          % endif
      - "COS_phone_number": ${ phone_number_formatted(attorneys[0].daytime_phone_number) if user_has_attorney else phone_number_formatted(users[0].phone_number) }
      - "COS_email": ${ attorneys[0].email if user_has_attorney else users[0].email }
