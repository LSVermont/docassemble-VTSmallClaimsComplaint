############################### CASE INFO ###############################
---
id: choose a court county
question: |
  What county is your case in?
fields:
  - note: |
      Choose the county where you will file this form.

      You can choose the county where you live, or the county where the defendant is.

  - County: user_selected_county
    code: sorted(all_courts.unique_column_values('branch') - {"Environmental", "Judicial Bureau", "Criminal", "Family"} )
  
  - note: |
      ${ collapse_template(in_which_county) }
---
id: claim principal
question: |
  How much are you suing for?
subquestion: |
  The total amount of your "claim" in small claims courts cannot be more than $10,000. There are three things that make up your total:

  - The "principal" (your damages)
  - Any interest you want to claim on that amount
  - Your court filing fee, if you want to get that amount back from the other party ($65 for claims of $1,000 or less, or $90 for more than $1,000)

  **Let's start with the principal (your damages).**
  
  What are your "damages"? How much does the defendant owe you, or how much money did they cause you to lose? You should be prepared to explain to the court the amount you enter here.

  Special types of damages you should know about:

  - Are you suing a former landlord over a security deposit? You can ask for double the total amount of the deposit if your landlord kept the deposit without a written reason, or if they waited more than 14 days to get your deposit back to you. See the [Security Deposit Roadmap on VTLawHelp.org](https://vtlawhelp.org/roadmap/security-deposit/step-5) for more information.
  
  - Are you a customer suing a business over a product or service that they sold you? You may be entitled to triple the amount you spent on the product or service, if the business lied to you about the product or service. [Read the law.](https://legislature.vermont.gov/statutes/section/09/063/02461)
fields:
  - "Damages / principal you want to claim": claim_principal
    datatype: currency
    min: 1
    max: 10000
---
code: |
  max_interest = 10000 - claim_principal
---
id: claim interest
question: |
  How much interest do you want to claim?
subquestion: |
  If a debt has gained interest, you can add a separate amount of interest on the Small Claims Complaint form. You should be prepared to explain to the court the amount you enter here.
  
  You can also enter $0.
  
  If you are not sure whether interest has accumulated on this debt, you can contact a lawyer for advice.
fields:
  - "Interest you want to claim": claim_interest
    datatype: currency
    max: ${ round(max_interest, 2) }
    validation messages:
      max: |
        The combined total of your claim and interest cannot be more than $10,000.00. Based on the amount of your claim, the maximum interest you can ask for is ${ currency(max_interest) }.
    required: False
---
id: claim court costs
question: |
  Court fee
subquestion: |
  Most people include the court filing fee in the amount they want to get from the defendant.
  
  In your case, your court filing fee is **${ currency(claim_court_fee)  }**.
fields:  
  - Do you want to add it to the amount you want to get from the defendant?: wants_to_claim_court_fee
    datatype: yesnoradio
  - note: |
      A reminder:
  
      * If your claim is $1,000 or less the fee will be $65.
      * If your claim is more than $1,000 the fee will be $90.

      When you give your Small Claims Complaint to the court, you need to either pay the filing fee or hand in a fee waiver form. If you have a low income and want to apply for a fee waiver, we will point you to the VTCourtForms Fee Waiver tool when you are done here. 
---
### Code to get court fee amount ####
depends on: 
  - claim_principal
  - claim_interest
code: |
  if claim_principal + claim_interest > 1000:
    claim_court_fee = 90
  else:
    claim_court_fee = 65
---
id: recap total claim
question: |
  Your total claim
subquestion: |
  Let's review your total claim.
  
  - Principal/damages: ${ currency(claim_principal) }
  
  - Interest: ${ currency(claim_interest) }

  % if wants_to_claim_court_fee:
  - Court filing fee: ${ currency(claim_court_fee) }
  % else:
  - Court filing fee: $0
  % endif

  % if (claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0)) > 10000:
    <i class="fas fa-hand-paper fa-3x" aria-hidden="true"></i>  **STOP!**
  
  **You have gone over the $10,000 limit for small claims court by ${ currency(claim_principal + claim_interest + claim_court_fee - 10000) }**. 
  
    If you want to use small claims court, **go back and edit** one of your amounts.
  % else:
  **TOTAL OF ${ currency((claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0))) }**

  This is the amount you will ask the court for.

  Tap Next to continue. If you want to change these amounts, tap Undo to go back.
  % endif
continue button field: recap_total_claim
---
id: complaint description
question: |
  What happened?
subquestion: |
  Describe why you are suing ${ other_parties }. Be specific about the reasons you are claiming a total of ${ currency((claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0))) }.
fields:
  - "Why are you suing ${ other_parties } for ${ currency((claim_principal + claim_interest + (claim_court_fee if wants_to_claim_court_fee else 0))) }?": complaint_description
    input type: area
    maxlength: 1130
---
id: documents attached to complaint
question: |
  Documents to support your claim
subquestion: |
  Supporting documents can include anything that supports your case.
  
  Examples include:
  
  - contract, invoice or receipt
  - letter, email or texts
  - photos

  With your complaint, you can include short documents related to the dispute. **Or you can wait until later in the process.** Whatever you include, you will need to send copies to the defendant later.
  
fields:
  - "Are you including supporting documents **now** with your Small Claims Complaint?": documents_attached_to_complaint
    datatype: yesnoradio
---
