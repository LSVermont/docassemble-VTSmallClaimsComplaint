  - other_parties[i].name.last
  - other_parties[i].name.middle
  - other_parties[i].name.suffix
question: |
  Name of ${ ordinal(i) } defendant
subquestion: |
  A defendant is the person who is being sued and is responding to a court action.
fields:
  - code: |
      other_parties[i].name_fields(person_or_business='unsure')
---
############################### CASE INFO ###############################
---
id: choose a court county
question: |
  What county is your case in?
fields:
  - note: |
      Choose the county where you will file this form.

  - County: user_selected_county
    code: sorted(all_courts.unique_column_values('branch') - {"Environmental", "Judicial Bureau", "Criminal", "Family"} )
  
  - note: |
      ${ collapse_template(which_county_to_choose) }
      ${ collapse_template(in_which_county) }
---
id: claim principal
question: |
  How much are you suing for?
fields:
  - "How much are you suing for?": claim_principal
    datatype: currency
    min: 1
    max: 10000
---
code: |
  max_interest = 10000 - claim_principal
---
id: claim interest
question: |
  How much interest is owed on the amount you are suing for?
subquestion: |
  You can leave this blank.
  
  Typically people do not add a separate interest amount on the Small Claims Complaint form, unless a lawyer has told them to do so for some reason.
fields:
  - "How much interest do you believe is owed on the amount you are suing for?": claim_interest
    datatype: currency
    max: ${ round(max_interest, 2) }
    validation messages:
      max: |
        The combined total of your claim and interest cannot exceed $10,000.00. Based on the amount of your claim, the maximum interest you can ask for is $${ round(max_interest, 2) }.
    required: False
---
id: claim court costs
question: |
  Court fee
subquestion: |
  Your court fee will be automatically entered on your documents based on the combined total of the claim amount and interest you are suing for.
  
  * If your claim is $1,000 or less the fee will be $65.
  * If your claim is more than $1,000 the fee will be $90.

  If you want to apply for a fee waiver, you will be able to navigate to the VTCourtForms Fee Waiver Interview on the download screen where you receive your small claims forms.
  
continue button field: claim_court_costs
---
### Code to get court fee amount ####
code: |
  if claim_principal + claim_interest > 1000:
    claim_court_fee = 90
  else:
    claim_court_fee = 65
---
### Code to get total claim amount and set max amount to $10,000 ###
code: |
  claim_amount_total = claim_principal + claim_interest + claim_court_fee
  if claim_amount_total > 10000:
    claim_amount_total = 10000
---
id: complaint description
question: |
  What happened?
fields:
  - "In your own words, describe what happened.": complaint_description
    input type: area
---
id: documents attached to complaint
question: |
  Supporting documents
subquestion: |
  Supporting documents can include anything that supports your case.
  
  Examples include:
  
  - Written contracts
  - Photos, or
  - Emails

  If you are submitting supporting documents with your Small Claims Complaint, you will need to send copies of them to the defendant and submit them to court with your complaint.
  
fields:
  - "Are you including supporting documents in your Small Claims Complaint?": documents_attached_to_complaint
    datatype: yesnoradio
