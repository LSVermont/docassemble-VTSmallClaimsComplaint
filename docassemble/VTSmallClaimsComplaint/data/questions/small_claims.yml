############################### INTRO SCREENS ###############################
---
id: basic questions intro screen
decoration: form-lineal
question: |
  ${interview_short_title}
subquestion: |   
  <p>${ intro_vtcourtforms_3_steps }</p>
  
  <i class="fas fa-file-text fa-2x"></i> This tool will produce a completed Small Claims Complaint form 100-00257 for Vermont courts. It is used when you want to sue a person, business or organization for $10,000 or less.

  <i class="fas fa-envelope fa-2x"></i> The tool will also give you some blank forms that you will send to the person, business or organization in a later step in the small claims process. We will give you instructions at the end in the Next Steps document.
  
  <i class="fas fa-clock fa-2x"></i> It may take you 30 minutes to complete this.

  <i class="fas fa-circle-info fa-2x"></i> It is free to use this program. This site is not a lawyer. Visit our [VTLawHelp.org website](https://vtlawhelp.org/) for legal information.

  Learn about the small claims court process on our Small Claims Roadmap on the [VTLawHelp.org website](https://vtlawhelp.org/roadmap/small-claims/step-1).

  <p>${ intro_vtcourtforms_created_by }</p>

continue button field: al_intro_screen
---
id: VT small claims intro
continue button field: VT_small_claims_intro
question: |
  About this tool
subquestion: | 
  To use this tool, you will need to:

  - read about the full small claims process on our Small Claims Roadmap at: [https://vtlawhelp.org/roadmap/small-claims/step-1](https://vtlawhelp.org/roadmap/small-claims/step-1).
  - know the name and address of the person, business or organization that you want to sue for $10,000 or less
  - make a list of each reason they owe you money or caused you to lose money. These are your “damages.”
  - come up with a total amount you want to sue for (You can include more than one dispute with the same defendant in your lawsuit, if the total amount you are asking for is $10,000 or less.)
  - be prepared to pay a court filing fee of $60 or $90, depending on the amount you are suing for
  - or, be prepared to submit a fee waiver form to the court at the same time that you submit your small claims complaint. (See our Small Claims Roadmap for details: [https://vtlawhelp.org/roadmap/small-claims/step-2](https://vtlawhelp.org/roadmap/small-claims/step-2))

  Ask for general help with court forms or the court process by contacting the [Vermont Judiciary Access and Resource Center](https://www.vermontjudiciary.org/self-help/ARC). Their services are free and they serve the whole state. They do NOT give legal advice.

  <h4>Our terms of use</h4>
fields:
  - To continue, please accept our [terms of use](https://vtlawhelp.org/vtcourtforms/terms-of-use).: acknowledged_information_use
    datatype: checkboxes
    none of the above: False    
    minlength: 1
    choices:
      - I accept the terms of use.
    validation messages:
      minlength: |
        You cannot continue unless you agree to the terms of use.
---
id: important_notes_to_user
question: |
  Important
subquestion: |  
  <i class="fa fa-exclamation-circle fa-2x"></i>  This tool does **not** file your small claims complaint form with the court. You will need to get it to the court yourself such as by email, mail or in person. We will give you instructions when you finish the form.
    
    Let's get started. Tap the Next button.
continue button field: important_notes_to_user
---
id: initial screening
question: |
  Do you want to sue a person, business or organization for $10,000 or less?
fields:
  - no label: money_screening
    datatype: yesnoradio
---
id: initial screening kickout
question: |
  Stop
subquestion: |
  You **cannot** sue someone for more than $10,000 in small claims court.
  
  If you want to sue someone for more than $10,000, but will settle for $10,000, you can use small claims court to get the $10,000. Some people do this because small claims court is easier and cheaper than going to the Civil Division of Vermont Superior Court.

  If you want to sue for more than $10,000 you cannot use this tool.

  Do you want to continue?
continue button field: money_screening_kickout
buttons:
  - DELETE your answers: restart
  - CONTINUE: continue
---
id: debt screening
question: |
  Is your case about a credit card transaction or about medical debt?
fields:
  - no label: debt_screening
    datatype: yesnoradio
---
id: debt screening kickout
question: |
  Stop
subquestion: |
  In Vermont, for a consumer credit transaction or medical debt, the most you can ask for in a small claims case is $5,000.

  You may use this tool if you are asking for $5,000 or less. Do you want to continue?
continue button field: debt_screening_kickout
buttons:
  - DELETE your answers: restart
  - CONTINUE: continue
---
id: non money screening
question: |
  Do you want something other than money?
subquestion: |
  For example, do you want the court to order someone to **do** something or **stop doing** something?
fields:
  - no label: non_money_screening
    datatype: yesnoradio
---
id: non money screening kickout
question: |
  Stop
subquestion: |
  Small claims court **cannot** help if you are asking the court to order someone to do something or stop doing something. That kind of order is called an “injunction.” You cannot use small claims court for an injunction.
continue button field: non_money_screening_kickout
buttons:
  - DELETE your answers: restart
  - CONTINUE anyway: continue
---
id: fee screening
question: |
  Are you aware of the court filing fee?
subquestion: |
  The small claims court filing fee is $65 for claims of $1,000 or less. It is $90 for claims over $1,000. You can pay the court with cash, check or money order.

  When you give your small claims complaint to the court, you need to either pay the filing fee or hand in a fee waiver form. If you have a low income, you could ask the court for a fee waiver. We will point you to the VTCourtForms Fee Waiver tool after you finish this small claims complaint.

    As part of your claim against the defendant, you can ask to be reimbursed for the court filing fee.
fields:
  - I understand: fee_screening
    datatype: yesno
---
id: fee screening kickout
question: |
  Filing fee for small claims court
subquestion: |
  The small claims court filing fee is $65 for claims of $1,000 or less. It is $90 for claims over $1,000. You can pay the court with cash, check or money order.

  When you give your small claims complaint to the court, you need to either pay the filing fee or hand in a fee waiver form. If you have a low income, you could ask the court for a fee waiver. We will point you to the VTCourtForms Fee Waiver tool after you finish this small claims complaint.

    In your complaint, you can ask the defendant to pay you back for the court filing fee.
  
  Do you want to continue?
continue button field: fee_screening_kickout
buttons:
  - DELETE your answers: restart
  - CONTINUE: continue
