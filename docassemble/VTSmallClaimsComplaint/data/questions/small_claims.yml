    datatype: yesnoradio
  - note: |
      Usually, the people who use this guided interview do **not** have a lawyer. If you are represented by a lawyer, the lawyer usually files court paperwork for you. Ask them about this.
---
id: attorney screening kickout
question: |
  Your attorney needs to fill out this form.
subquestion: |
  **Stop** now and come back with your attorney.
  
  You can create a free account so you can save your answers and come back later with your attorney. Choose **sign up** in the Menu above, or **register** below.

  If your attorney is with you hit **Next** to complete your small claims complaint.
continue button field: attorney_screening_kickout
---
id: attorney phone and email
question: |
  What is ${ attorneys[0].name }'s phone number and email?
fields:
  - "${ attorneys[0].name }'s daytime phone number:": attorneys[0].daytime_phone_number
    maxlength: 27
  - "${ attorneys[0].name }'s email address:": attorneys[0].email
    maxlength: 38
---
############################### DEFENDANT INFO ###############################
---
id: names of opposing parties
sets:
