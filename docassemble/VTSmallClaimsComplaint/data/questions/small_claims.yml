  Warning
subquestion: |
  Usually, the people who use this tool do **not** have a lawyer. If you are represented by a lawyer, the lawyer usually files court paperwork for you. Ask them about this.
  
  You can create a free account so you can save your answers and come back later after you talk to your lawyer. Choose **sign up** in the menu at the top of the screen, or **register** below.

  If you have a lawyer for this case, we will collect their information next.

